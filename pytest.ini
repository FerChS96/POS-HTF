[pytest]
# IMPORTANTE: solo se recolecta tests/.
# Los test_*.py de la raiz de POS_HTF son scripts manuales que golpean
# la base de PRODUCCION. NO deben ejecutarse desde pytest.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    integracion: toca servicios reales; desactivado por defecto
filterwarnings =
    ignore::DeprecationWarning
